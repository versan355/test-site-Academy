<title>Карта уютных мест для чтения</title>

<style>

      --accent: #C8956F;
      --accent-light: #3D3530;
      --accent-dark: #9B7355;
      --border: #4A423A;
      color-scheme: dark;

  }

  :root[data-theme="dark"] {
    --cream: #2A2620;
    --text: #E8E6E3;
    --accent: #C8956F;
    --accent-light: #3D3530;
    --accent-dark: #9B7355;
    --border: #4A423A;
    color-scheme: dark;

    color: var(--text);
    font-family: var(--font-body);

    text-align: center;
    border-bottom: 2px solid var(--border);
  }

  .hero h1 {
    font-family: var(--font-display);
    font-size: 2.5rem;
    font-weight: 400;
    text-wrap: balance;
    margin: 0 0 var(--space-sm) 0;
    color: var(--accent-dark);
  }

  .hero p {

    max-width: 600px;
    margin: 0 auto;
    color: var(--text);
    opacity: 0.85;
  }

  /* Filters */
  .filters {

    gap: var(--space-sm);

    justify-content: center;

    color: var(--cream);
  }

    font-size: 1.8rem;

    padding: var(--space-lg);
    border-radius: 8px;
    max-width: 500px;
    margin: 0 auto;
  }

  .propose-section h2 {
    font-family: var(--font-display);
    font-size: 1.5rem;
    margin: 0 0 var(--space-md) 0;
    color: var(--accent-dark);
  }

  .form-group {
    margin-bottom: var(--space-md);
  }

  .form-group label {
    display: block;
    font-size: 0.95rem;
    margin-bottom: var(--space-xs);
    color: var(--text);
    font-weight: 500;
  }

    width: 100%;
    padding: var(--space-sm);
    border: 1.5px solid var(--border);
    border-radius: 6px;
    font-family: var(--font-body);
    font-size: 0.95rem;
    background: var(--cream);
    color: var(--text);
    box-sizing: border-box;
  }

  .form-group textarea {
    resize: vertical;
    min-height: 100px;
  }

  .submit-btn {
    width: 100%;
    padding: var(--space-md);
    background: var(--accent);
    color: var(--cream);
    border: none;
    border-radius: 6px;
    font-size: 1rem;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.2s;
  }

  .submit-btn:hover {
    background: var(--accent-dark);
    box-shadow: 0 0 15px rgba(166, 124, 82, 1), 0 0 35px rgba(166, 124, 82, 0.8), 0 0 55px rgba(166, 124, 82, 0.5);
    transform: translateY(-2px);
  }

  .container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 0 var(--space-sm);
  }

  .places-section {
    max-width: 1200px;
    margin: 0 auto;
  }

  /* Success message */
  .success-msg {
    display: none;
    background: #7BC67B;
    color: white;
    padding: var(--space-md);
    border-radius: 6px;
    margin-bottom: var(--space-md);
    text-align: center;
  }

  .success-msg.show {
    display: block;
  }
</style>
